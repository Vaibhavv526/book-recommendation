<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #121212;
        }

        .text-white {
            color: white;
        }

        .book-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            transition: 0.3s;
            height: 100%;
        }

        .book-card:hover {
            transform: scale(1.05);
            box-shadow: 0px 4px 20px rgba(255,255,255,0.2);
        }

        .book-img {
            height: 250px;
            width: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .navbar-custom {
            background-color: #ffffff;
            border: none;
        }

        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-custom">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="/">📚 Book Recommender</a>
        </div>

        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- Content -->
<div class="container">
    <h1 class="text-white text-center" style="margin-bottom:40px;">
        Top 50 Books
    </h1>

    <div class="row">
        {% for i in range(book_name|length) %}
            <div class="col-md-3" style="margin-bottom:30px;">
                <div class="book-card">
                    <img class="book-img" src="{{ image[i] }}">

                    <h4 class="text-white">{{ book_name[i] }}</h4>
                    <p class="text-white">by {{ author[i] }}</p>

                    <p class="text-white">Votes: {{ votes[i] }}</p>
                    <p class="text-white">Rating: ⭐ {{ rating[i] }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
